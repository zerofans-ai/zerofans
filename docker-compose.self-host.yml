services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.self-host
    ports:
      - "8787:8787"
    env_file: .env
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      PORT: "8787"
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: zerofans-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_REGION: us-east-1
      NEON_CONNECTION_STRING: postgresql://zerofans:${POSTGRES_PASSWORD:-zerofans}@postgres:5432/zerofans
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zerofans
      POSTGRES_USER: zerofans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zerofans}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerofans"]
      interval: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 10
    restart: unless-stopped

  init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: zerofans
      PGDATABASE: zerofans
      PGPASSWORD: ${POSTGRES_PASSWORD:-zerofans}
    volumes:
      - ./db/schema.sql:/schema.sql:ro
      - ./scripts/docker-init.sh:/docker-init.sh:ro
    entrypoint: ["sh", "/docker-init.sh"]

volumes:
  pgdata:
  miniodata:
